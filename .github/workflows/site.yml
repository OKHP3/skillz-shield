name: Publish Skillz Shield

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site_evidence.py'
      - 'tests/test_site_evidence.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build_site_evidence.py'
      - 'tests/test_site_evidence.py'
      - '.github/workflows/site.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shield-site-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'published' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate evidence boundaries without network access
        run: python -m unittest discover -s tests -p test_site_evidence.py -v
      - name: Prepare offline evidence for pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/build_site_evidence.py --offline --fallback site/public/data/evidence.json
      - name: Refresh public evidence from trusted main runs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_site_evidence.py --fallback site/public/data/evidence.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Type-check
        working-directory: site
        run: npm run typecheck
      - name: Verify browser evidence states
        working-directory: site
        run: npm test
      - name: Build static site
        working-directory: site
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
