name: Verify Skillz Shield
on:
  push:
    branches: [main]
    paths:
      - action.yml
      - entrypoint.py
      - skill_security/**
      - tests/**
      - '!tests/test_site_evidence.py'
      - .github/workflows/verify.yml
  pull_request:
    paths:
      - action.yml
      - entrypoint.py
      - skill_security/**
      - tests/**
      - '!tests/test_site_evidence.py'
      - .github/workflows/verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
  live-engines:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          mode: resolve
          state: ${{ runner.temp }}/security-state
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./
        with:
          mode: install
          state: ${{ runner.temp }}/security-state
      - name: Exercise both real engines on safe draft and detection fixtures
        env:
          STATE_PATH: ${{ runner.temp }}/security-state
        run: python tests/live_smoke.py --state "$STATE_PATH"
      - name: Exercise whole ZIP packages and readable results
        env:
          STATE_PATH: ${{ runner.temp }}/security-state
        run: python tests/live_zip_smoke.py --state "$STATE_PATH"
      - name: Check out immutable public diagnostic inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OKHP3/skillz
          ref: 7830bbfd5c08803589ed09d39197d5edfabe0c95
          path: diagnostic-input
          persist-credentials: false
      - name: Record representative inventory diagnostics without claiming a pass
        env:
          STATE_PATH: ${{ runner.temp }}/security-state
        run: python tests/live_inventory_probe.py --state "$STATE_PATH" --repository diagnostic-input
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-smoke-evidence
          path: |
            ${{ runner.temp }}/security-state/pins.json
            ${{ runner.temp }}/security-state/smoke-report.json
            ${{ runner.temp }}/security-state/zip-smoke-report.json
            ${{ runner.temp }}/security-state/inventory-probe.json
          retention-days: 30
